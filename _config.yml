title: H-AI-
description: Hai's knowledge graph — every file is one node, every link is one edge.

# Theme: just-the-docs (sidebar nav + search + breadcrumbs)
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

# Convert [text](file.md) links to .html paths automatically
relative_links:
  enabled: true
  collections: true

# just-the-docs features
search_enabled: true
heading_anchors: true
color_scheme: light

# Show "View on GitHub" link in the top-right corner
aux_links:
  "View on GitHub":
    - "https://github.com/hhuang-brex/H-AI-"

# Don't try to render Jekyll/Ruby files as content
exclude:
  - Gemfile
  - Gemfile.lock
  - _site/
  - .jekyll-cache/
  - .plans/

# Site URL (used for absolute links and SEO)
url: https://hhuang-brex.github.io
baseurl: /H-AI-
