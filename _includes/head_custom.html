<script>
/* Pre-paint theme boot (no flash). Runs before jtd.js; rewrites the scheme <link> directly.
   NOTE: no // line comments — the site's compress layout strips newlines, which would turn
   a // comment into a whole-script comment and break execution. Block comments only. */
(function () {
  try {
    var saved = localStorage.getItem('hai-theme');
    var theme = (saved === 'hai-dark' || saved === 'default') ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'hai-dark' : 'default');
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'hai-dark') {
      var link = document.querySelector('link[rel="stylesheet"]');
      if (link && link.href) {
        link.href = link.href.replace(/just-the-docs-[A-Za-z0-9-]+\.css/, 'just-the-docs-hai-dark.css');
      }
    }
  } catch (e) { /* fail open to the default light scheme */ }
})();
</script>
