<!-- head_custom.html — pre-paint theme boot (no flash of light).
     Runs before jtd.js loads, so it rewrites the scheme <link> directly rather than via jtd.setTheme.
     Theme names: "default" = light `hai` scheme; "hai-dark" = dark scheme. -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('hai-theme');
    var theme = (saved === 'hai-dark' || saved === 'default') ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'hai-dark' : 'default');
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'hai-dark') {
      // First stylesheet is the just-the-docs color-scheme link (same element jtd.setTheme targets).
      var link = document.querySelector('link[rel="stylesheet"]');
      if (link && link.href) {
        link.href = link.href.replace(/just-the-docs-[A-Za-z0-9-]+\.css/, 'just-the-docs-hai-dark.css');
      }
    }
  } catch (e) { /* fail open to the default light scheme */ }
})();
</script>
